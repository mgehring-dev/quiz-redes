name: Avisar no Teams

# A cada push em main ou dev: espera a Vercel terminar o deploy desse commit
# (acompanhando o status "Vercel" do commit) e posta UMA mensagem no Teams
# com o resultado final. Nada é enviado enquanto o deploy está em andamento.
on:
  push:
    branches: [main, dev]

permissions:
  contents: read
  statuses: read

concurrency:
  group: notify-teams-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Esperar o deploy da Vercel terminar
        id: vercel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            status=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/statuses" \
              --jq '[.[] | select(.context | startswith("Vercel"))][0] // empty')
            state=$(echo "$status" | jq -r '.state // empty')
            if [ -n "$state" ] && [ "$state" != "pending" ]; then
              echo "state=$state" >> "$GITHUB_OUTPUT"
              echo "log_url=$(echo "$status" | jq -r '.target_url // empty')" >> "$GITHUB_OUTPUT"
              echo "Deploy terminou: $state"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::A Vercel não terminou o deploy em 15 minutos."
          echo "state=timeout" >> "$GITHUB_OUTPUT"

      - name: Postar no Teams
        if: steps.vercel.outputs.state != 'timeout'
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          STATE: ${{ steps.vercel.outputs.state }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ENV_NAME: ${{ github.ref_name == 'main' && 'Production' || 'Preview' }}
          LOG_URL: ${{ steps.vercel.outputs.log_url }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: node .github/scripts/notify-teams.mjs
